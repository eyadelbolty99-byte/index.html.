<script>
/* ===== detection.js — reusable, no DOM access ===== */
const Det=(()=>{
/* sensitivity = how much evidence is needed before a person counts as "lying" and how small a movement counts as "still" */
const SENS={Low:{motion:.02,confirm:2500},Medium:{motion:.03,confirm:1500},High:{motion:.045,confirm:1000}},KEYS=[0,11,12,15,16,23,24,27,28],HYS=800;
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),vis=(p)=>p.visibility??1;
function metrics(lm,asp){const s=mid(lm[11],lm[12]),h=mid(lm[23],lm[24]),dx=(s.x-h.x)*asp,dy=s.y-h.y;
const v=[11,12,23,24].reduce((a,i)=>a+vis(lm[i]),0)/4;
const low=[[27,28],[25,26]].find(([a,b])=>vis(lm[a])>=.5&&vis(lm[b])>=.5);let axis=null;
if(low){const l=mid(lm[low[0]],lm[low[1]]);axis=Math.atan2(Math.abs((s.x-l.x)*asp),Math.abs(s.y-l.y))*180/Math.PI}
return{angle:Math.atan2(Math.abs(dx),Math.abs(dy))*180/Math.PI,axis,headHip:Math.abs(lm[0].y-h.y),bodyLen:Math.hypot(dx,dy)||1e-6,sw:Math.hypot((lm[11].x-lm[12].x)*asp,lm[11].y-lm[12].y),vis:v,center:{x:(s.x+h.x)/2,y:(s.y+h.y)/2}}}
const valid=m=>m.bodyLen>.05&&m.sw/m.bodyLen>.2&&m.sw/m.bodyLen<3;
function smooth(prev,cur,a=.5){return prev?cur.map((p,i)=>({x:prev[i].x+a*(p.x-prev[i].x),y:prev[i].y+a*(p.y-prev[i].y),z:0,visibility:p.visibility})):cur}
function quality(data){let n=data.length/4,s=0,q=0;for(let i=0;i<data.length;i+=4){const l=.3*data[i]+.59*data[i+1]+.11*data[i+2];s+=l;q+=l*l}
const m=s/n,sd=Math.sqrt(Math.max(0,q/n-m*m));return{mean:m,sd,ok:m>30&&sd>12}}
function makeFire(cfg,emit){const last={};return(type,level,zone,conf,now,extra)=>{const k=type+"|"+zone;if(now-(last[k]||0)<cfg.cool)return false;last[k]=now;
emit({type,level,zone,confidence:+Math.min(1,Math.max(0,conf)).toFixed(2),timestamp:now,...extra});return true}}
/* hand: 21 MediaPipe landmarks */
function handState(h){const palm=dist(h[0],h[9])||1e-6,ext=[[8,6],[12,10],[16,14],[20,18]].map(([t,p])=>dist(h[t],h[0])>dist(h[p],h[0])*1.12).filter(Boolean).length;
const tucked=Math.min(dist(h[4],h[9]),dist(h[4],h[13]),dist(h[4],h[5]))<palm*.55;
return ext>=4&&tucked?"palm_thumb_tucked":ext>=4?"open_palm":ext<=1?"fist":"other"}
/* Signal for Help: palm with tucked thumb HELD, then fist, within 2.5 s. Strict mode needs it twice within 8 s. */
class HandSeq{constructor(fire){this.fire=fire;this.tn=0;this.fn=0;this.tT=0;this.reps=[]}
update(h,now,zone,strict){const st=handState(h);if(dist(h[0],h[9])<.03)return st;
if(st==="palm_thumb_tucked"){this.tn++;this.fn=0;if(this.tn>=5)this.tT=now}
else if(st==="fist"){this.fn++;this.tn=0;if(this.fn>=3&&this.tT&&now-this.tT<2500){this.tT=0;this.reps=this.reps.filter(t=>now-t<8000);this.reps.push(now);if(!strict||this.reps.length>=2){this.reps=[];this.fire("distress_gesture","critical",zone,.9,now,{gesture:"Signal for Help"})}}}
else{this.tn=0;this.fn=0}return st}}
class Tracker{constructor(cfg,fire){this.cfg=cfg;this.fire=fire;this.t0=0;this.seen=false;this.lying=false;this.lyT0=0;this.nl0=0;this.prev=null;this.pt=0;this.mv=[];this.imm=null;this.since=0;this.level="info";this.upT=0;this.wx=[];this.hist=[];this.ref=0;this.dropT=0;this.lostFired=false}
update(lm,now,asp,zone){const c=this.cfg,S=SENS[c.sens]||SENS.Medium,m=metrics(lm,asp);this.zone=zone;
if(!valid(m)||m.vis<c.minVis)return{posture:"unknown",level:this.level,conf:m.vis,immS:0,m,invalid:true};
if(!this.t0)this.t0=now;const age=now-this.t0;
/* "lying" needs ALL of: torso far from vertical, whole body axis (shoulders to feet, when feet are visible) far from vertical, head not far above hips */
const lyg=m.angle>c.lying&&(m.axis==null||m.axis>c.lying-10)&&m.headHip<.8*m.bodyLen,raw=m.angle<c.upright?"upright":(lyg?"lying":"other");
if(raw==="upright")this.ref=Math.max(this.ref,m.bodyLen);
if(raw==="lying"){this.nl0=0;if(!this.lyT0)this.lyT0=now}else{if(!this.nl0)this.nl0=now;if(now-this.nl0>=HYS){this.lyT0=0;if(this.lying){this.lying=false;this.imm=null;this.lostFired=false}}}
this.hist.push([now,m.center.y]);while(this.hist.length&&now-this.hist[0][0]>1500)this.hist.shift();
if(m.center.y-Math.min(...this.hist.map(h=>h[1]))>.45*(this.ref||m.bodyLen))this.dropT=now;
if(!this.lying&&this.lyT0&&now-this.lyT0>=S.confirm&&age>=1000){this.lying=true;this.since=now;this.imm=null}
let mv=0;const dt=Math.max(16,now-(this.pt||now-66));this.pt=now;
if(this.prev){for(const i of KEYS)mv+=Math.hypot((lm[i].x-this.prev[i].x)*asp,lm[i].y-this.prev[i].y);mv=mv/KEYS.length/m.bodyLen*(66/dt)}
this.prev=lm.map(p=>({x:p.x,y:p.y}));this.mv.push(mv);if(this.mv.length>15)this.mv.shift();
const med=[...this.mv].sort((a,b)=>a-b)[this.mv.length>>1];this.mo=med;
if(this.lying){if(this.mv.length>=8&&med<S.motion){if(this.imm==null)this.imm=now}else this.imm=null}
const immS=this.imm==null?0:(now-this.imm)/1000,drop=this.dropT&&now-this.dropT<6000;
this.level=this.lying&&immS>=c.immobile?"critical":this.lying?"warning":"info";
if(age>=1000&&!this.seen){this.seen=true;this.fire("person_detected","info",zone,m.vis,now)}
if(this.lying)this.fire("person_lying","warning",zone,m.vis,now,{suddenDrop:!!drop});
if(this.level==="critical")this.fire("possible_collapse","critical",zone,m.vis,now,{suddenDrop:!!drop,immobileSeconds:Math.round(immS)});
if(age>=1000)this.gesture(lm,now,asp,zone,m);
return{posture:this.lying?"lying":raw,level:this.level,conf:m.vis,m,immS}}
/* waving (wrist above head, sideways oscillation >=4 turns, held 1.5 s) or both arms held up 3 s */
gesture(lm,now,asp,zone,m){const c=this.cfg,nose=lm[0].y,ok=i=>vis(lm[i])>=Math.max(.6,c.minVis),mg=.25*m.bodyLen,up=[15,16].map(i=>ok(i)&&lm[i].y<nose-mg);
if(!(up[0]||up[1])||this.lying||m.angle>c.upright+15){this.upT=0;this.wx=[];return}
if(!this.upT){this.upT=now;this.wx=[]}
const x=lm[up[0]?15:16].x*asp,L=this.wx[this.wx.length-1];if(!L||Math.abs(x-L[1])>.01)this.wx.push([now,x]);while(this.wx.length&&now-this.wx[0][0]>2500)this.wx.shift();
let ch=0,dir=0,mn=1e9,mx=-1e9;for(let k=1;k<this.wx.length;k++){const d=Math.sign(this.wx[k][1]-this.wx[k-1][1]);if(d&&dir&&d!==dir)ch++;if(d)dir=d}this.wx.forEach(p=>{mn=Math.min(mn,p[1]);mx=Math.max(mx,p[1])});
const held=now-this.upT,wave=ch>=4&&mx-mn>.3*m.bodyLen&&held>1500,both=up[0]&&up[1]&&held>3000;
if(wave||both)this.fire("distress_gesture","critical",zone,m.vis,now,{gesture:wave?"waving":"arms raised"})}
lostLying(now,zone){if(!this.lying||this.lostFired)return;const immS=(now-(this.imm??this.since))/1000;if(immS>=this.cfg.immobile){this.lostFired=true;this.level="warning";this.fire("lost_lying","warning",zone,.3,now,{immobileSeconds:Math.round(immS)})}}}
return{Tracker,HandSeq,metrics,smooth,quality,handState,makeFire,defaults:{sens:"Medium",immobile:15,upright:30,lying:60,minVis:.6,cool:15000,lostMs:4000,strict:"Normal"}}})();
</script>
<script>
/* ===== Victim & Collapse Detection module (isolated) ===== */
const VD={tr:[],tid:0,hands:[],tuckT:0,hs:"",dk:"collapse",fire:null,zones:[],cfg:{...Det.defaults},log:[],src:"camera",demo:false,sound:false,url:"",run:false,trk:{},sm:{},res:{},stream:null,lm:null,last:0,raf:0,lvlT:0,sel:null,drawing:null,id:1,qual:{ok:true},ud:null};
const vdE=id=>document.getElementById(id);
const CONN=[[11,12],[11,23],[12,24],[23,24],[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[24,26],[26,28],[0,11],[0,12]];
const LV={info:["Person detected","var(--grn)"],warning:["Person lying down","var(--org)"],critical:["Possible collapse","var(--red)"]};
function vdView(){return`<div class="vdr"><select id="vsrc" aria-label="Video source"><option value="camera">Device camera</option><option value="mjpeg">ESP32-CAM stream (MJPEG URL)</option><option value="file">Demo video file</option></select>
<input id="vurl" placeholder="http://192.168.x.x:81/stream" style="display:none;min-width:240px"><input id="vfile" type="file" accept="video/*" style="display:none">
<button class="b p" id="vstart">Start</button><button class="b" id="vstop">Stop</button><button class="b" id="vdemo" style="border-color:var(--org)">DEMO: collapse</button><button class="b" id="vdemo2" style="border-color:var(--org)">DEMO: help signal</button><span id="vind" class="pill" style="--c:var(--gry)">Camera inactive</span></div>
<div id="vmsg" class="mut"></div><div id="vban"></div>
<div class="vdg"><div><div class="vdv"><canvas id="vcv" width="640" height="480" aria-label="Video with skeleton and zones"></canvas><video id="vvid" playsinline muted style="display:none"></video><img id="vimg" alt="" style="display:none" crossorigin="anonymous"></div>
<div class="vdr" style="margin-top:10px"><input id="vzn" placeholder="Zone name" style="width:140px"><button class="b" id="vzd">Draw zone</button><button class="b" id="vzc">Clear zones</button><span class="mut">Drag on the video to draw 1–4 zones.</span></div>
<p class="mut">Runs in this browser only. Nothing is recorded or uploaded. Experimental — not a medical diagnosis.</p></div>
<div><div class="card" id="vstate"></div><div id="vzones" style="margin:10px 0"></div>
<div class="card"><h3>Settings</h3><div class="vdr"><label class="mut" title="Low = needs the most evidence, fewest false alarms. High = reacts fastest, more false alarms.">Sensitivity <select id="cs"><option>Low<option selected>Medium<option>High</select></label><label class="mut" title="Seconds a person must stay lying AND still before Possible collapse is raised.">Immobility (s) <input id="ci" type="number" value="10" min="2" style="width:70px"></label></div>

<details class="mut"><summary>What do these settings mean?</summary><p><b>Sensitivity</b> — how much evidence is needed. Low: person must stay down about 2.5 s and only tiny movement counts as still (fewest false alarms). Medium: 1.5 s. High: 1 s (fastest, more false alarms).<br><b>Immobility (s)</b> — how long a person must stay lying and still before “Possible collapse”. Default 15.<br><b>Upright &lt; °</b> — torso within this angle of vertical = standing or sitting.<br><b>Lying &gt; °</b> — torso and body axis beyond this angle = lying. Angles in between (bending, leaning) are ignored.<br><b>Min visibility</b> — the AI ignores body points it is less sure about than this. Higher = fewer false alarms but may miss people in poor light.<br><b>Gesture check</b> — Normal: the hand “Signal for Help” (palm, thumb tucked, fold fingers over it) once. Strict: twice within 8 s. Waving needs about 1.5 s of side-to-side waving above the head; both arms up for 3 s also counts.<br><b>Enable sound / Test alert</b> — turns the alarm sound on; Test plays it.<br><b>Send events URL</b> — each real event is sent there as an HTTP POST (demo events are never sent).</p></details>
